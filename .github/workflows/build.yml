name: build

# 触发：打 tag(v*) 时构建并发布 Release；也可在 Actions 页面手动触发
#
# 发布形态：同一次 GitHub Release 承载「两个附件」
#   ① 主程序安装包（Win NSIS / macOS dmg / Linux AppImage+deb）—— 由本工作流 CI 构建并自动上传
#   ② 模型安装包 DesktopPetModels-Setup.exe（约 189MB，含 24 个 Live2D 模型）
#      —— 不进 git 仓库、也不在 CI 内构建（无模型源，且属第三方/个人模型），
#         须由人工手动上传到同一 Release（详见仓库 .github/RELEASE.md）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64 --ia32
          - os: macos-latest
            target: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            target: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Fetch vendor (Live2D cores)
        run: npm run fetch-vendor
      - name: Strip electronDist (CI cross-platform)
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.build.electronDist;fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('electronDist removed');"
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPetWeb-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 汇总三平台构建产物（各平台一个 artifact 子目录，落到 artifacts/ 下）
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ── 创建 Release：主程序安装包（CI 构建、三平台）作为附件自动上传 ──
      #   files: artifacts/**/* 覆盖 win(nsis .exe)/mac(.dmg)/linux(.AppImage/.deb) 的**全部**产物，
      #   它们被汇总到**同一个** Release，满足“主程序附件”形态。
      - name: Create Release (main installers)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # 自定义说明文本（配合 generate_release_notes 时，body 会“前置”在自动生成的 notes 之前），
          # 传达“两个附件”形态与源码/GPLv3 合规信息。
          # 注：本 action 的 append_body 是布尔开关（非文本），此处按官方语义使用 body。
          body: |
            # DesktopPetWeb <version> · 跨平台桌面宠物

            一个基于 **Electron + Live2D** 的桌面宠物：**透明 / 无边框 / 置顶**，鼠标**分区穿透**（只在人物与设置面板上可点），支持**视线跟随鼠标、拖拽、点击反应、待机动作**；模型放在外部 `models/` 文件夹，**丢文件夹即用**。

            ## 🐾 快速上手（Windows）
            1. 下载本页 Assets 中的 Windows 安装包 `.exe`
            2. 双击安装（默认装到 `D:\DesktopPet`），从开始菜单 / 安装目录启动
            3. 启动即出现宠物「肥牛」，可拖拽、点击互动、滚轮缩放、右键设置
            > 安装包为 **64 位（x64）**：适用于 64 位 Windows 10/11；**32 位系统不支持**。

            ## 📦 我该下哪个？
            - **Windows（x64）**：`DesktopPetWeb Setup <version>.exe`（NSIS，64 位）
            - **Windows（x86）**：`DesktopPetWeb Setup <version>.exe`（NSIS，32 位）
            - **Linux**：`DesktopPetWeb-<version>.AppImage`（免安装，`chmod +x` 后运行）/ `desktop-pet-web_<version>_amd64.deb`
            - **macOS（Apple 芯片）**：`DesktopPetWeb-<version>-arm64.dmg`
            - **macOS（Intel）**：`DesktopPetWeb-<version>-x64.dmg`（或未带架构后缀的 `.dmg`）

            ## 🎭 更多模型（模型安装包）
            主程序**只内置一个「肥牛」模型**。想换/加模型，请下载同一 Release 里的 **`DesktopPetModels-Setup.exe`**（约 190 MB，**内含 24 个 Live2D 模型**）：
            - **Windows**：双击该 exe 安装——它会自动定位主程序安装目录并把模型导入到 `models/`。
            - **Linux / macOS（无安装器）**：用**压缩软件（7-Zip / Keka / 归档实用工具）直接打开该 exe**，把里面的模型文件夹**提取**出来；再到桌宠「设置 → 外部模型文件夹」选择该目录即可加载。
            > 该模型包体积大且含第三方模型，**不进 git 仓库、也不在 CI 构建**，需**人工上传到本 Release**（详见 `.github/RELEASE.md`）。

            ## 📄 源码与许可
            - **源码**：本 Release 对应 tag，或直接下载本页 `Source code (zip/tar.gz)`。
            - **许可**：源码以 **GPL-3.0-or-later** 授权；第三方组件 / Live2D 内核 / 模型授权边界见 `THIRD-PARTY-NOTICES.md`。

      # ── 模型安装包（DesktopPetModels-Setup.exe）——由人工手动附加，**不在 CI 构建/上传** ──
      #   原因：约 189MB，含第三方/个人 Live2D 模型（版权受限），既不进仓库，也无 CI 内可用的模型源。
      #   手动方式（二选一）：
      #     a) GitHub Web：Release 编辑页 → “Attach binaries” → 选择 DesktopPetModels-Setup.exe → Update release
      #     b) 命令行：  gh release upload <tag> /path/to/DesktopPetModels-Setup.exe
      #   说明：本注释为“可选人工步骤”的占位说明，不执行任何构建；
      #         若日后存在带凭据的自动化流程（能取到模型包），可在此处新增 `gh release upload` 步骤。
