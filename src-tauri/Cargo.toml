[package]
name = "desktop-pet-tauri"
version = "1.0.4"
description = "DesktopPet Tauri v2 shell — transparent, borderless, always-on-top desktop pet hosting the shared web/ frontend"
authors = ["DesktopPetWeb Team"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

# Tauri v2 推荐结构：逻辑放在 lib 里（便于单元测试 / 移动端复用），
# 可执行入口 main.rs 仅调用 app_lib::run()。
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生文件/目录选择对话框「导入模型」与「选择外部模型文件夹」命令所需。
tauri-plugin-dialog = "2"

# 发布构建体积/性能优化（Tauri 官方推荐）。
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
